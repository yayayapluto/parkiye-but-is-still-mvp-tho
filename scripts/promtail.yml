server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: parkieee
    static_configs:
      - targets:
          - localhost
        labels:
          job: parkieee
          app: parkieee-api
          __path__: /var/log/app/*.log
    pipeline_stages:
      - json:
          expressions:
            level: level
            msg:   msg
            time:  time
            module: module
            trace_id: trace_id
            error: error
      - labels:
          level:
          module:
      - timestamp:
          source: time
          format: RFC3339Nano
      - output:
          source: msg