services:

  # ── PostgreSQL ──────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: parkieee_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER:     ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB:       ${DB_NAME:-parkieee}
      TZ:                Asia/Jakarta
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-parkieee}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - parkieee_net

volumes:
  postgres_data:
    driver: local
  pgadmin_data:
    driver: local

networks:
  parkieee_net:
    driver: bridge