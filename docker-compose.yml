services:
  postgres:
    image: postgres:16-alpine
    container_name: parkieee_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-parkieee}
      TZ: Asia/Jakarta
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-parkieee}" ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - parkieee_net

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: parkieee_api
    restart: unless-stopped
    ports:
      - "${SERVER_PORT:-8080}:8080"
    environment:
      APP_ENV: ${APP_ENV:-production}
      APP_NAME: ${APP_NAME:-parkieee}
      APP_DEBUG: ${APP_DEBUG:-false}
      APP_URL: ${APP_URL:-}
      ALLOW_ORIGINS: ${ALLOW_ORIGINS:-*}
      PLACE_NAME: ${PLACE_NAME:-Parkir}
      QR_SECRET: ${QR_SECRET}
      SERVER_HOST: 0.0.0.0
      SERVER_PORT: 8080
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      DB_NAME: ${DB_NAME:-parkieee}
      DB_SSLMODE: ${DB_SSLMODE:-disable}
      DB_LOG_LEVEL: ${DB_LOG_LEVEL:-warn}
      DB_MAX_OPEN_CONNS: ${DB_MAX_OPEN_CONNS:-25}
      DB_MAX_IDLE_CONNS: ${DB_MAX_IDLE_CONNS:-10}
      DB_CONN_MAX_LIFETIME_SECONDS: ${DB_CONN_MAX_LIFETIME_SECONDS:-300}
      DB_CONN_MAX_IDLE_TIME_SECONDS: ${DB_CONN_MAX_IDLE_TIME_SECONDS:-60}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      JWT_ACCESS_TOKEN_TTL: ${JWT_ACCESS_TOKEN_TTL:-15m}
      JWT_REFRESH_TOKEN_TTL: ${JWT_REFRESH_TOKEN_TTL:-168h}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      LOG_JSON_FORMAT: "true"
      LOG_OUTPUT_PATHS: stdout,storage/logs/app.log
      LOG_ADD_SOURCE: ${LOG_ADD_SOURCE:-false}
      ENABLE_TRACING: ${ENABLE_TRACING:-true}
      TEMPO_ENDPOINT: tempo:4318
      ENABLE_PROFILING: ${ENABLE_PROFILING:-false}
      PYROSCOPE_ENDPOINT: http://pyroscope:4040
      MIDTRANS_SERVER_KEY: ${MIDTRANS_SERVER_KEY}
      MIDTRANS_ENV: ${MIDTRANS_ENV:-sandbox}
      OCR_ENABLED: ${OCR_ENABLED:-true}
      OCR_API_URL: http://python-ocr:8000
      OCR_TIMEOUT: ${OCR_TIMEOUT:-15s}
      OCR_MAX_RETRIES: ${OCR_MAX_RETRIES:-2}
      OCR_AUTO_ACCEPT_THRESHOLD: ${OCR_AUTO_ACCEPT_THRESHOLD:-0.80}
      STORAGE_DIR: /app/storage/photos
      OCR_STORAGE_PREFIX: /app/storage/photos
    volumes:
      - ./storage:/app/storage
    depends_on:
      postgres:
        condition: service_healthy
      python-ocr:
        condition: service_healthy
    networks:
      - parkieee_net

  python-ocr:
    build:
      context: ../Python-OCR
      dockerfile: Dockerfile
    container_name: parkieee_python_ocr
    restart: unless-stopped
    ports:
      - "${OCR_PORT:-8001}:8000"
    environment:
      S3_ENDPOINT: ${S3_ENDPOINT}
      S3_BUCKET: ${S3_BUCKET}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_PUBLIC_BASE_URL: ${S3_PUBLIC_BASE_URL}
    volumes:
      - ./storage:/mnt/storage
    healthcheck:
      test: [ "CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - parkieee_net

  pyroscope:
    image: grafana/pyroscope:latest
    container_name: parkieee_pyroscope
    restart: unless-stopped
    ports:
      - "${PYROSCOPE_PORT:-4040}:4040"
    volumes:
      - pyroscope_data:/data
    networks:
      - parkieee_net

  prometheus:
    image: prom/prometheus:latest
    container_name: parkieee_prometheus
    restart: unless-stopped
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./scripts/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    networks:
      - parkieee_net

  promtail:
    image: grafana/promtail:latest
    container_name: parkieee_promtail
    restart: unless-stopped
    volumes:
      - ./storage/logs:/var/log/app:ro
      - ./scripts/promtail.yml:/etc/promtail/config.yml:ro
    command: -config.file=/etc/promtail/config.yml
    depends_on:
      - loki
    networks:
      - parkieee_net

  grafana:
    image: grafana/grafana:latest
    container_name: parkieee_grafana
    restart: unless-stopped
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
      - GF_INSTALL_PLUGINS=grafana-piechart-panel
    volumes:
      - grafana_data:/var/lib/grafana
      - ./scripts/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus
      - loki
      - tempo
      - pyroscope
    networks:
      - parkieee_net

  loki:
    image: grafana/loki:latest
    container_name: parkieee_loki
    restart: unless-stopped
    ports:
      - "${LOKI_PORT:-3100}:3100"
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - loki_data:/loki
    networks:
      - parkieee_net

  tempo:
    image: grafana/tempo:2.6.1
    container_name: parkieee_tempo
    restart: unless-stopped
    ports:
      - "3200:3200"
      - "4317:4317"
      - "4318:4318"
    volumes:
      - ./scripts/tempo.yml:/etc/tempo/tempo.yml:ro
      - tempo_data:/var/tempo
    command: -config.file=/etc/tempo/tempo.yml
    networks:
      - parkieee_net

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: parkieee_cloudflared
    restart: unless-stopped
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - parkieee_net

volumes:
  postgres_data:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local
  loki_data:
    driver: local
  tempo_data:
    driver: local
  pyroscope_data:
    driver: local

networks:
  parkieee_net:
    driver: bridge