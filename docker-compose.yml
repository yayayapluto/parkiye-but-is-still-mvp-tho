services:
  postgres:
    image: postgres:16-alpine
    container_name: parkieee_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER:     ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB:       ${DB_NAME:-parkieee}
      TZ:                Asia/Jakarta
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-parkieee}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - parkieee_net

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: parkieee_api
    restart: unless-stopped
    ports:
      - "${SERVER_PORT:-8080}:8080"
    environment:
      APP_ENV:        ${APP_ENV:-production}
      APP_NAME:       ${APP_NAME:-parkieee}
      APP_DEBUG:      ${APP_DEBUG:-false}
      SERVER_HOST:    ${SERVER_HOST:-0.0.0.0}
      SERVER_PORT:    ${SERVER_PORT:-8080}
      DB_HOST:        postgres
      DB_PORT:        5432
      DB_USER:        ${DB_USER:-postgres}
      DB_PASSWORD:    ${DB_PASSWORD:-postgres}
      DB_NAME:        ${DB_NAME:-parkieee}
      DB_SSLMODE:     ${DB_SSLMODE:-disable}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      ENABLE_TRACING: ${ENABLE_TRACING:-true}
      TEMPO_ENDPOINT: tempo:4318
    volumes:
      - ./storage/logs:/app/storage/logs
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - parkieee_net

  prometheus:
    image: prom/prometheus:latest
    container_name: parkieee_prometheus
    restart: unless-stopped
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./scripts/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    networks:
      - parkieee_net

  promtail:
    image: grafana/promtail:latest
    container_name: parkieee_promtail
    restart: unless-stopped
    volumes:
      - ./storage/logs:/var/log/app:ro
      - ./scripts/promtail.yml:/etc/promtail/config.yml:ro
    command: -config.file=/etc/promtail/config.yml
    depends_on:
      - loki
    networks:
      - parkieee_net

  grafana:
    image: grafana/grafana:latest
    container_name: parkieee_grafana
    restart: unless-stopped
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
      - GF_INSTALL_PLUGINS=grafana-piechart-panel
    volumes:
      - grafana_data:/var/lib/grafana
      - ./scripts/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus
      - loki
      - tempo
    networks:
      - parkieee_net

  loki:
    image: grafana/loki:latest
    container_name: parkieee_loki
    restart: unless-stopped
    ports:
      - "${LOKI_PORT:-3100}:3100"
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - loki_data:/loki
    networks:
      - parkieee_net

  tempo:
    image: grafana/tempo:2.6.1
    container_name: parkieee_tempo
    restart: unless-stopped
    ports:
      - "3200:3200"
      - "4317:4317"
      - "4318:4318"
    volumes:
      - ./scripts/tempo.yml:/etc/tempo/tempo.yml:ro
      - tempo_data:/var/tempo
    command: -config.file=/etc/tempo/tempo.yml
    networks:
      - parkieee_net

volumes:
  postgres_data:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local
  loki_data:
    driver: local
  tempo_data:
    driver: local

networks:
  parkieee_net:
    driver: bridge